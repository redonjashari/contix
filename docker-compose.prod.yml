version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: contix-postgres-prod
    environment:
      POSTGRES_DB: concert_db
      POSTGRES_USER: concert_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert_user -d concert_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: contix-redis-prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: contix-app-prod
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://concert_user:${POSTGRES_PASSWORD}@postgres:5432/concert_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      HOLD_TTL_SECONDS: 600
      HOLD_CLEANUP_INTERVAL: 60000
      REDIS_URL: redis://redis:6379
      BCRYPT_SALT_ROUNDS: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: contix-worker-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://concert_user:${POSTGRES_PASSWORD}@postgres:5432/concert_db
      HOLD_CLEANUP_INTERVAL: 60000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: npm run worker

  nginx:
    image: nginx:alpine
    container_name: contix-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
